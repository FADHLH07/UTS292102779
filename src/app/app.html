<div class="app-wrapper">
  <app-header (menuToggle)="toggleSidebar()"></app-header>
  <app-sidebar [isOpen]="sidebarOpen"></app-sidebar>
  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-sm-6"><h3 class="mb-0">Chat</h3></div>
          <div class="col-sm-6"><ol class="breadcrumb float-sm-end mb-0"><li class="breadcrumb-item">Home</li><li class="breadcrumb-item active">Chat</li></ol></div>
        </div>
      </div>
    </div>
    <div class="app-content">
      <div class="container-fluid">
        <section class="card">
          <div class="card-header"><h5 class="card-title mb-0"><i class="bi bi-chat-dots me-2"></i>Messages</h5></div>
          <div class="card-body p-0"><app-chat></app-chat></div>
        </section>
      </div>
    </div>
  </main>
  <app-footer></app-footer>
</div>
